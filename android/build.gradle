// Plugin versions are declared in settings.gradle's `plugins` block. The legacy
// buildscript classpath that used to live here pinned AGP 7.3.1, which conflicted
// with that declaration and could not compile against SDK 36.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
